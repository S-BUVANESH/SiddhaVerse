version: "3.9"

services:
  siddhaverse-api:
    build: .
    container_name: siddhaverse-api
    ports:
      - "8000:8000"
    volumes:
      - ./siddhaverse.db:/data/corpus/siddhaverse.db:ro
      - ./qdrant_db:/data/qdrant_db
    env_file:
      - .env.production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: "4"
